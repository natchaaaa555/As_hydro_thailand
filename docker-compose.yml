version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: hydrotwin_db
    environment:
      POSTGRES_USER: hydro_admin
      POSTGRES_PASSWORD: hydro_secret_password
      POSTGRES_DB: hydrotwin
    ports:
      - "5432:5432"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: hydrotwin_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://hydro_admin:hydro_secret_password@db:5432/hydrotwin
    depends_on:
      - db
    volumes:
      - ./backend:/app

volumes:
  pgdata: